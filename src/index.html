<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rudera</title>
		<link rel="stylesheet" href="css/style.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
	</head>
	<body>
		<div id="map"></div>

		<div id="navbar">
			<div id="navbar-left">
				<div id="navbar-title">cisówek-leśniczówka.pl</div>
			</div>
			<div id="navigation">
				<button
					id="myReservation"
					class="navigation-button"
					style="display: none"
				>
					<i class="fas fa-calendar-check"></i><span id="myReservationLabel">Moja rezerwacja</span>
				</button>
				<button id="foresterDescription" class="navigation-button">
					<i class="fas fa-house"></i><span class="nav-label">Opis leśniczówki</span>
				</button>
				<button
					id="areaDescription"
					class="navigation-button"
				>
					<i class="fas fa-map-marked-alt"></i><span class="nav-label">Okolica</span>
				</button>
				<button id="contact" class="navigation-button"><i class="fas fa-phone"></i><span class="nav-label">Kontakt</span></button>
				<div id="underline"></div>
			</div>
			<button id="hamburger-btn" aria-label="Otwórz menu" aria-expanded="false">
				<i class="fas fa-bars"></i>
			</button>
			<div id="navbar-right">
				<button id="login" class="navigation-button"><i class="fas fa-right-to-bracket"></i><span class="nav-label">Zaloguj</span></button>
				<button
					id="logout"
					class="navigation-button"
					style="display: none"
				>
					<i class="fas fa-right-from-bracket"></i><span class="nav-label">Wyloguj</span>
				</button>
				<span id="user-display" style="display: none;"></span>
			</div>
		</div>
		<div id="hero">
			<div class="hero-text">
				<h1>Leśniczówka w Cisówku</h1>
				<p>Zarezerwuj pobyt w sercu lasu</p>
			</div>
			<div id="availability-bar">
				<div class="search-field">
					<label class="availabilityBarLabel">Data przyjazdu</label>
					<input type="date" id="quickCheckIn" />
				</div>
				<div class="search-field">
					<label class="availabilityBarLabel">Data wyjazdu</label>
					<input type="date" id="quickCheckOut" />
				</div>
				<div class="search-field">
					<label class="availabilityBarLabel">Dorośli</label>
					<input type="number" id="quickAdults" min="1" max="10" value="1" />
				</div>
				<div class="search-field">
					<label class="availabilityBarLabel">Do lat 13</label>
					<input type="number" id="quickChildren" min="0" max="10" value="0" />
				</div>
				<button id="checkAvailability">Sprawdź dostępność</button>
			</div>
			<div id="hero-booking"></div>
			<div id="hero-content"></div>
		</div>
		<div id="page-container">
			<div id="auth-status"></div>
			<div id="subpage"></div>
			<div id="subpages">
				<div id="supbageBooking"></div>
			</div>
		</div>
		<script>
			((g) => {
				var h,
					a,
					k,
					p = "The Google Maps JavaScript API",
					c = "google",
					l = "importLibrary",
					q = "__ib__",
					m = document,
					b = window;
				b = b[c] || (b[c] = {});
				var d = b.maps || (b.maps = {}),
					r = new Set(),
					e = new URLSearchParams(),
					u = () =>
						h ||
						(h = new Promise(async (f, n) => {
							await (a = m.createElement("script"));
							e.set("libraries", [...r] + "");
							for (k in g)
								e.set(
									k.replace(
										/[A-Z]/g,
										(t) => "_" + t[0].toLowerCase(),
									),
									g[k],
								);
							e.set("callback", c + ".maps." + q);
							a.src =
								`https://maps.${c}apis.com/maps/api/js?` + e;
							d[q] = f;
							a.onerror = () =>
								(h = n(Error(p + " could not load.")));
							a.nonce =
								m.querySelector("script[nonce]")?.nonce || "";
							m.head.append(a);
						}));
				d[l]
					? console.warn(p + " only loads once. Ignoring:", g)
					: (d[l] = (f, ...n) =>
							r.add(f) && u().then(() => d[l](f, ...n)));
			})({ key: "", v: "weekly" });
		</script>
	</body>

	<script type="module" src="js/reservation.js"></script>
	<script type="module" src="js/index.js"></script>
</html>
